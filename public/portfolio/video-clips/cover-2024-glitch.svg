<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="900" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D1814"/>
      <stop offset="1" stop-color="#332922"/>
    </linearGradient>
    <filter id="blurSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.12"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <rect x="120" y="110" width="1360" height="680" rx="28" fill="#0F0D0B" opacity="0.42"/>

  <g opacity="0.28">
    <rect x="0" y="220" width="1600" height="4" fill="#D7C1A0"/>
    <rect x="0" y="406" width="1600" height="5" fill="#D7C1A0"/>
    <rect x="0" y="585" width="1600" height="3" fill="#D7C1A0"/>
  </g>

  <g opacity="0.86">
    <text x="800" y="505" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="280" font-weight="900" letter-spacing="10" fill="#E8D8C2">2024</text>
    <text x="806" y="502" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="280" font-weight="900" letter-spacing="10" fill="#BFA78A" opacity="0.45">2024</text>
  </g>

  <g filter="url(#blurSoft)" opacity="0.35">
    <rect x="270" y="328" width="220" height="10" fill="#D7C1A0"/>
    <rect x="1050" y="356" width="180" height="8" fill="#D7C1A0"/>
    <rect x="380" y="548" width="200" height="9" fill="#D7C1A0"/>
    <rect x="980" y="575" width="240" height="10" fill="#D7C1A0"/>
  </g>

  <text x="800" y="770" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="40" letter-spacing="4" fill="#DCCAB4" opacity="0.9">SHORT CLIPS / SCIENCE FICTION CLASS</text>

  <rect width="1600" height="900" filter="url(#grain)" opacity="0.75"/>
</svg>
